name: sentiment

services:
  db:
    image: quay.io/sclorg/postgresql-16-c9s:20261104
    container_name: sentiment-db
    environment:
      POSTGRESQL_USER: ${DB_USER:-sentiment_user}
      POSTGRESQL_DATABASE: ${DB_NAME:-sentiment_db}
    secrets:
      - source: db_password
        target: POSTGRESQL_PASSWORD
        type: env
    volumes:
      - db-data:/var/lib/pgsql/data:Z
      - ./db/00-init.sh:/opt/app-root/src/postgresql-start/00-init.sh:Z,ro
    networks:
      - backend
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/sentiment-analyzer:1.0.0
    container_name: sentiment-api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sentiment_db}
      DB_USER: ${DB_USER:-sentiment_user}
      DB_PASSWORD_FILE: /run/secrets/db_password
      PORT: 8080
    secrets:
      - source: db_password
        target: /run/secrets/db_password
    networks:
      - frontend
      - backend
    depends_on:
      - db
    restart: unless-stopped

  proxy:
    build:
      context: ./proxy
      dockerfile: Containerfile
    image: localhost/sentiment-proxy:1.0.0
    container_name: sentiment-proxy
    ports:
      - "127.0.0.1:8000:8080"
    networks:
      - frontend
    depends_on:
      - api
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
    driver_opts:
      isolate: "true"
  backend:
    driver: bridge
    internal: true
    driver_opts:
      isolate: "true"

volumes:
  db-data:
    driver: local

secrets:
  db_password:
    external: true
