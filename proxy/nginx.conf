worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    
    access_log /var/log/nginx/access.log main;
    
    sendfile on;
    keepalive_timeout 65;
    
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp_path;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    
    # Dynamic resolver configuration (generated by entrypoint.sh)
    include /etc/nginx/resolver.conf;
    
    server {
        listen 8080;
        server_name _;
        
        location / {
            # Use variable to force runtime DNS resolution
            set $backend_host api;
            proxy_pass http://$backend_host:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Return 503 for upstream errors during API restarts
            proxy_intercept_errors on;
        }
        
        location /health {
            access_log off;
            set $backend_host api;
            proxy_pass http://$backend_host:8080/health;
            proxy_intercept_errors on;
        }
        
        # Custom error page for upstream failures
        error_page 500 502 503 504 =503 /50x.json;
        location = /50x.json {
            internal;
            default_type application/json;
            return 503 '{"status":"unavailable","error":"Service temporarily unavailable"}';
        }
    }
}
