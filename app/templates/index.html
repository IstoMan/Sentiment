<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analyzer for Reviews</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bulma.min.css') }}">
</head>
<body class="has-background-light">
    <nav class="navbar is-white" aria-label="main">
        <div class="container is-max-desktop">
            <div class="navbar-brand">
                <span class="navbar-item is-size-4 has-text-weight-bold has-text-primary">📊 Sentiment Analyzer</span>
            </div>
        </div>
    </nav>

    <section class="section">
        <div class="container is-max-desktop">

            <div class="box mb-5">
                <h2 class="title is-4">Analyze a Review</h2>
                <form id="analyzeForm">
                    <div class="field">
                        <label class="label" for="reviewText">Enter your review:</label>
                        <div class="control">
                            <textarea id="reviewText" name="text" class="textarea" placeholder="Type your product or movie review here..." required></textarea>
                        </div>
                    </div>
                    <div class="field">
                        <div class="control">
                            <button type="submit" id="submitBtn" class="button is-primary">Analyze Sentiment</button>
                        </div>
                    </div>
                </form>
                <div id="result" class="notification is-hidden"></div>
            </div>

            <div class="box mb-5">
                <h2 class="title is-4">Statistics</h2>
                <div id="stats" class="columns is-multiline">
                    <div class="column">
                        <p class="has-text-grey">Loading statistics...</p>
                    </div>
                </div>
            </div>

            <div class="box">
                <h2 class="title is-4">Recent Reviews</h2>
                <div id="reviews">
                    <p class="has-text-grey">Loading reviews...</p>
                </div>
            </div>
        </div>
    </section>

    <script>
        const API_BASE = '/api';
        const SENTIMENT_PALETTE = {
            positive: 'success',
            negative: 'danger',
            neutral: 'warning'
        };

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function paletteName(sentiment) {
            return SENTIMENT_PALETTE[sentiment] || 'primary';
        }

        function showResult(resultDiv, name, html) {
            resultDiv.className = `notification has-background-${name}-soft`;
            resultDiv.innerHTML = html;
        }

        function hideResult(resultDiv) {
            resultDiv.className = 'notification is-hidden';
            resultDiv.innerHTML = '';
        }

        document.getElementById('analyzeForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const text = document.getElementById('reviewText').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');

            if (!text) {
                alert('Please enter some text');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.classList.add('is-loading');
            hideResult(resultDiv);

            try {
                const response = await fetch(`${API_BASE}/analyze`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const tone = paletteName(data.sentiment);

                showResult(resultDiv, tone, `
                    <p class="title is-5 has-text-${tone}-bold">Sentiment: ${escapeHtml(data.sentiment).toUpperCase()}</p>
                    <p class="has-text-${tone}-bold"><strong>Compound Score:</strong> ${data.compound.toFixed(4)}</p>
                    <p class="has-text-${tone}-bold"><strong>Positive:</strong> ${(data.positive * 100).toFixed(1)}% |
                       <strong>Negative:</strong> ${(data.negative * 100).toFixed(1)}% |
                       <strong>Neutral:</strong> ${(data.neutral * 100).toFixed(1)}%</p>
                `);

                document.getElementById('reviewText').value = '';

                loadStats();
                loadReviews();
            } catch (error) {
                showResult(resultDiv, 'danger', `<p class="has-text-danger-bold"><strong>Error:</strong> ${escapeHtml(error.message)}</p>`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('is-loading');
            }
        });

        function statTile(value, label, name) {
            return `
                <div class="column is-half-tablet is-one-quarter-desktop">
                    <div class="notification has-background-${name}-soft has-text-centered mb-0">
                        <p class="title is-3 has-text-${name}-bold">${value}</p>
                        <p class="has-text-${name}-bold">${label}</p>
                    </div>
                </div>
            `;
        }

        async function loadStats() {
            const statsDiv = document.getElementById('stats');

            try {
                const response = await fetch(`${API_BASE}/stats`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();

                statsDiv.innerHTML = [
                    statTile(data.total_reviews, 'Total Reviews', 'primary'),
                    statTile(`${data.positive_percentage}%`, 'Positive', 'success'),
                    statTile(`${data.negative_percentage}%`, 'Negative', 'danger'),
                    statTile(`${data.neutral_percentage}%`, 'Neutral', 'warning')
                ].join('');
            } catch (error) {
                statsDiv.innerHTML = '<div class="notification has-background-danger-soft mb-0"><p class="has-text-danger-bold">Failed to load statistics</p></div>';
            }
        }

        async function loadReviews() {
            const reviewsDiv = document.getElementById('reviews');

            try {
                const response = await fetch(`${API_BASE}/reviews?limit=10`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();

                if (data.reviews.length === 0) {
                    reviewsDiv.innerHTML = '<p class="has-text-grey">No reviews yet. Be the first to analyze one!</p>';
                    return;
                }

                reviewsDiv.innerHTML = data.reviews.map(review => {
                    const preview = review.original_text.length > 200
                        ? `${review.original_text.substring(0, 200)}...`
                        : review.original_text;
                    const when = new Date(review.created_at).toLocaleString();
                    const tone = paletteName(review.sentiment);
                    return `
                        <div class="block">
                            <div class="level is-mobile mb-2">
                                <div class="level-left">
                                    <div class="level-item">
                                        <span class="tag has-background-${tone}-soft has-text-${tone}-bold">${escapeHtml(review.sentiment)}</span>
                                    </div>
                                </div>
                                <div class="level-right">
                                    <div class="level-item">
                                        <span class="is-size-7 has-text-grey">${escapeHtml(when)}</span>
                                    </div>
                                </div>
                            </div>
                            <p class="mb-2">${escapeHtml(preview)}</p>
                            <p class="is-size-7 has-text-grey">Score: ${Number(review.compound_score).toFixed(4)}</p>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                reviewsDiv.innerHTML = '<div class="notification has-background-danger-soft mb-0"><p class="has-text-danger-bold">Failed to load reviews</p></div>';
            }
        }

        loadStats();
        loadReviews();

        setInterval(() => {
            loadStats();
            loadReviews();
        }, 30000);
    </script>
</body>
</html>
