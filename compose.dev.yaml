# Development override for live-reload
# Usage: podman-compose -f compose.yaml -f compose.dev.yaml up -d
services:
  api:
    volumes:
      - ./app:/app/app:Z
    command: ["--reload", "--workers", "1", "--access-logfile", "-", "--error-logfile", "-", "app:app"]
    environment:
      FLASK_DEBUG: "1"
